server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: finance-support
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance_support}
    username: ${DATABASE_USERNAME:finance}
    password: ${DATABASE_PASSWORD:finance_local}
  flyway:
    enabled: true

app:
  owner-id: ${FINANCE_OWNER_ID:11111111-1111-1111-1111-111111111111}
  timezone: ${FINANCE_TIMEZONE:Europe/Moscow}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-sol}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  rag:
    enabled: ${RAG_ENABLED:false}
    inference-url: ${RAG_INFERENCE_URL:http://192.168.1.34:7997}
    inference-api-key: ${RAG_INFERENCE_API_KEY:}
    qdrant-url: ${RAG_QDRANT_URL:http://192.168.1.34:6333}
    qdrant-api-key: ${RAG_QDRANT_API_KEY:}
    collection: ${RAG_COLLECTION:finance_knowledge}
    embedding-model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    reranker-model: ${RAG_RERANKER_MODEL:Alibaba-NLP/gte-multilingual-reranker-base}
    vector-size: ${RAG_VECTOR_SIZE:1024}
    candidate-count: ${RAG_CANDIDATE_COUNT:12}
    result-count: ${RAG_RESULT_COUNT:5}

logging:
  level:
    org.springframework.jdbc.core: INFO
