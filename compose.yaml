services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance_support
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_local
    ports:
      - "5432:5432"
    volumes:
      - finance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_support"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finance-postgres:
