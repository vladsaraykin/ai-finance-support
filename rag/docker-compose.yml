services:
  inference:
    image: michaelf34/infinity:0.0.77
    command:
      - v2
      - --model-id
      - BAAI/bge-m3
      - --model-id
      - Alibaba-NLP/gte-multilingual-reranker-base
      - --port
      - "7997"
      - --device
      - cuda
      - --engine
      - torch
      - --dtype
      - float16
      - --batch-size
      - "2"
      - --api-key
      - ${INFINITY_API_KEY:?Set INFINITY_API_KEY in rag/.env}
    environment:
      HF_HOME: /app/.cache
      INFINITY_ANONYMOUS_USAGE_STATS: "0"
    ports:
      - "7997:7997"
    volumes:
      - infinity-cache:/app/.cache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in rag/.env}
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  infinity-cache:
  qdrant-data:
